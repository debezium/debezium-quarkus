debezium.source.offset.storage=org.apache.kafka.connect.storage.MemoryOffsetBackingStore
debezium.source.schema.history.internal=io.debezium.relational.history.MemorySchemaHistory
debezium.source.name=test
debezium.source.topic.prefix=topic
debezium.source.topic.naming.strategy=io.quarkus.debezium.testsuite.deployment.naming.LowercaseSchemaTopicNamingStrategy
debezium.source.schema.include.list=INVENTORY
debezium.source.snapshot.mode=initial
debezium.source.capturing.orders.destination=topic.inventory.orders
debezium.source.include.schema.changes=false
debezium.source.heartbeat.interval.ms=5

debezium.source.connector.class=io.debezium.connector.db2.Db2Connector
debezium.source.database.hostname=${DB2_HOSTNAME}
debezium.source.database.port=${DB2_PORT}
debezium.source.database.user=${DB2_USERNAME}
debezium.source.database.password=${DB2_PASSWORD}
debezium.source.database.dbname=${DB2_DATABASE}
debezium.deployment.server=true

quarkus.devservices.enabled=false
