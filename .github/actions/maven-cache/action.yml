name: "Maven Cache"
description: "Restores the Maven ~/.m2/repository cache"

inputs:
  key:
    description: "The maven cache key to use"
    required: true

runs:
  using: "composite"
  steps:
    # Restore only: the cache under this key is populated exclusively by the "Build Debezium & Dependencies"
    # job, which installs the upstream Debezium snapshots into it. Jobs that consume the cache must never
    # save it themselves, otherwise a job that happens to miss the key would publish a repository without
    # those snapshots under the very key every later run resolves. A miss is a workflow defect (the save
    # was skipped or evicted), so fail here with a clear message instead of letting Maven fail later on
    # unresolvable snapshot dependencies, or worse, silently resolve them from a remote repository.
    - name: Restore Maven Repository
      id: cache-check
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: ${{ inputs.key }}
        fail-on-cache-miss: true
